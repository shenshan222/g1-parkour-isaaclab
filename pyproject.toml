[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "humanoid_parkour"
version = "0.1.0"
description = "G1 humanoid parkour tasks as an Isaac Lab external extension package"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Humanoid Parkour Course Project" }]
keywords = ["isaac-lab", "humanoid", "parkour", "g1", "reinforcement-learning"]
classifiers = [
    "License :: OSI Approved :: BSD License",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.4.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["humanoid_parkour*"]

[tool.setuptools.package-data]
humanoid_parkour = ["py.typed"]
